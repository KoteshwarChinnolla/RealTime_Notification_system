spring.application.name=project
server.port=8081

spring.datasource.url=${DATA_BASE_URL:jdbc:postgresql://hrmdb.c3ykgskuuzr8.ap-south-1.rds.amazonaws.com:5432/postgres}
spring.jpa.properties.hibernate.default_schema=${DATA_BASE_SCHEMA:employee}
spring.datasource.username=${DATA_BASE_USER:postgres}
spring.datasource.password=${DATA_BASE_PASSWORD:HrmAnasolDb}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

project.image=images/

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


server.servlet.context-path=/employee

management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoints.web.exposure.include=health
