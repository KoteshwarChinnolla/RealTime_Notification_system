
# role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: hrms
  name: service-reader
rules:
- apiGroups: [""]
  resources: ["services", "endpoints", "pods"]
  verbs: ["get", "list", "watch"]
---
# rolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-services
  namespace: hrms
subjects:
- kind: ServiceAccount
  name: default
  namespace: hrms
roleRef:
  kind: Role
  name: service-reader
  apiGroup: rbac.authorization.k8s.io

